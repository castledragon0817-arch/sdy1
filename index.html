<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정리</title>
    <link rel="icon" href="data:,">
    <!-- 홈 전용 style.css를 뒤에 둬야 공통 css의 배경색(--bg)을 덮어쓴다 -->
    <link rel="stylesheet" href="./math/style-m-common.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="wrap">
        <header class="page-head">
        </header>

        <div class="category-tabs">
            <button type="button" class="tab-btn tab-math active" onclick="showCategory('math')">M</button>
            <button type="button" class="tab-btn tab-eng" onclick="showCategory('eng')">E</button>
        </div>

        <nav class="subject-grid" id="math-group">
            <a class="subject-card" href="./math/a1-exponentLogarithm.html">
                <strong>ExponentLogarithm</strong>
            </a>
            <a class="subject-card" href="./math/a2-trigonometric.html">
                <strong>Trigonometric</strong>
            </a>
            <a class="subject-card" href="./math/a3-sequence.html">
                <strong>Sequence</strong>
            </a>
            <a class="subject-card" href="./math/b1-differential.html">
                <strong>Differential</strong>
            </a>
            <a class="subject-card" href="./math/b2-integration.html">
                <strong>Integration</strong>
            </a>
            <a class="subject-card" href="./math/c1-numberOfCase.html">
                <strong>NumberOfCase</strong>
            </a>
            <a class="subject-card" href="./math/c2-probability.html">
                <strong>Probability</strong>
            </a>
            <a class="subject-card" href="./math/c3-statistics.html">
                <strong>Statistics</strong>
            </a>
            <a class="subject-card" href="./math/ss-exponentLogarithm.html">
                <strong>ss-exponentLogarithm</strong>
            </a>
            <a class="subject-card" href="./math/ss-trigonometric.html">
                <strong>ss-trigonometric</strong>
            </a>
            <a class="subject-card" href="./math/ss-sequence.html">
                <strong>ss-sequence</strong>
            </a>
            <a class="subject-card" href="./math/ss-cal.html">
                <strong>ss-cal</strong>
            </a>
            <a class="subject-card" href="./math/ss-prob.html">
                <strong>ss-prob</strong>
            </a>
        </nav>

        <nav class="subject-grid" id="eng-group" style="display:none">
            <a class="subject-card" href="./eng/basevoca.html">
                <strong>Basevoca</strong>
            </a>
            <button type="button" class="subject-card" onclick="document.getElementById('sentence-modal').showModal()">
                <strong>듀냐</strong>
            </button>
        </nav>
    </div>


    <dialog id="sentence-modal" class="deepen-modal">
        <form method="dialog">
            <button type="submit" class="deepen-close" aria-label="닫기">&times;</button>
        </form>
        <h2>듀냐</h2>
        <p>아직 준비 중이에요.</p>
    </dialog>

    <script>
        function showCategory(cat) {
            document.getElementById('math-group').style.display = cat === 'math' ? '' : 'none';
            document.getElementById('eng-group').style.display = cat === 'eng' ? '' : 'none';
            document.querySelector('.tab-math').classList.toggle('active', cat === 'math');
            document.querySelector('.tab-eng').classList.toggle('active', cat === 'eng');
        }
    </script>
</body>


</html>
